<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>パチンコシミュレーター</title>
    <style>
        :root {
            --accent: #ff6b6b;
            --accent-2: #4ecdc4;
            --accent-3: #ffd93d;
            --panel: rgba(10, 16, 28, 0.88);
            --panel-strong: #05070d;
            --line: rgba(255,255,255,0.16);
        }
        body[data-machine="garo"],
        body[data-machine="garo12"] {
            --accent: #ffd93d;
            --accent-2: #ff6b6b;
            --accent-3: #f59e0b;
        }
        body[data-machine="ghoul"] {
            --accent: #e11d48;
            --accent-2: #8b5cf6;
            --accent-3: #4ecdc4;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 34px),
                linear-gradient(90deg, rgba(78,205,196,0.05) 0 1px, transparent 1px 44px),
                linear-gradient(135deg, #130d1c 0%, #101c2f 42%, #171018 100%);
            color: #eee;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                180deg,
                rgba(255,255,255,0.035) 0,
                rgba(255,255,255,0.035) 1px,
                transparent 1px,
                transparent 5px
            );
            mix-blend-mode: screen;
            opacity: 0.36;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent);
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .controls {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .control-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .control-group {
            flex: 1;
            min-width: 120px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 16px;
        }
        select option {
            background: #1a1a2e;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-start {
            background: linear-gradient(135deg, var(--accent), #ee5a5a);
            color: white;
            box-shadow: 0 12px 32px color-mix(in srgb, var(--accent) 24%, transparent);
        }
        .btn-start:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 36px color-mix(in srgb, var(--accent) 42%, transparent);
        }
        .btn-start:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        .display {
            background:
                linear-gradient(145deg, rgba(255,255,255,0.08), transparent 30%),
                var(--panel-strong);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 24px 60px rgba(0,0,0,0.36),
                inset 0 0 40px rgba(78,205,196,0.08);
        }
        .display.is-impact {
            animation: displayImpact 520ms ease;
        }
        .cut-in {
            position: absolute;
            top: 92px;
            left: -10%;
            right: -10%;
            z-index: 9;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-120%) skewX(-10deg);
            background:
                linear-gradient(90deg, transparent, rgba(0,0,0,0.72) 16%, rgba(0,0,0,0.82) 84%, transparent),
                linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 54%, transparent), transparent);
            border-top: 1px solid color-mix(in srgb, var(--accent-3) 55%, transparent);
            border-bottom: 1px solid color-mix(in srgb, var(--accent-3) 55%, transparent);
            box-shadow:
                0 0 30px color-mix(in srgb, var(--accent) 34%, transparent),
                inset 0 0 20px rgba(255,255,255,0.1);
            text-align: center;
            padding: 12px 44px;
        }
        .cut-in.show {
            animation: cutInRush 1120ms cubic-bezier(.18,.84,.22,1) forwards;
        }
        .cut-in-title {
            color: #fff;
            font-size: 32px;
            line-height: 1;
            font-weight: 900;
            text-shadow:
                0 0 16px color-mix(in srgb, var(--accent-3) 74%, transparent),
                0 2px 0 rgba(0,0,0,0.65);
        }
        .cut-in-subtitle {
            color: rgba(255,255,255,0.86);
            font-size: 14px;
            margin-top: 5px;
        }
        .cut-in-final-minus {
            filter: grayscale(0.2);
        }
        .burst-layer {
            position: absolute;
            inset: 0;
            z-index: 8;
            overflow: hidden;
            pointer-events: none;
        }
        .burst-piece {
            position: absolute;
            left: 50%;
            top: 36%;
            width: var(--w, 8px);
            height: var(--h, 24px);
            border-radius: 2px;
            background: var(--piece-color, var(--accent-3));
            box-shadow: 0 0 14px var(--piece-color, var(--accent-3));
            opacity: 0;
            transform: translate(-50%, -50%) rotate(0deg) scale(0.6);
            animation: burstPiece 920ms ease-out forwards;
            animation-delay: var(--delay, 0ms);
        }
        .machine-stage {
            min-height: 154px;
            position: relative;
            overflow: hidden;
            border: 1px solid color-mix(in srgb, var(--accent) 52%, transparent);
            border-radius: 8px;
            margin-bottom: 18px;
            background:
                linear-gradient(110deg, rgba(255,255,255,0.08), transparent 24%),
                linear-gradient(180deg, rgba(255,255,255,0.06), transparent 52%),
                linear-gradient(135deg, rgba(255,107,107,0.18), rgba(78,205,196,0.12) 48%, rgba(255,217,61,0.12));
            box-shadow:
                inset 0 0 36px rgba(0,0,0,0.55),
                0 0 28px color-mix(in srgb, var(--accent) 20%, transparent);
        }
        .machine-stage::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 14px),
                repeating-linear-gradient(180deg, transparent 0 11px, rgba(0,0,0,0.16) 11px 12px);
            opacity: 0.34;
        }
        .machine-stage::after {
            content: "";
            position: absolute;
            inset: -40% -20%;
            background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.32), transparent 58%);
            transform: translateX(-55%);
            opacity: 0;
        }
        .machine-stage.effect-spin::after,
        .machine-stage.effect-rush::after,
        .machine-stage.effect-hit::after,
        .machine-stage.effect-chain::after {
            animation: stageSweep 1300ms ease;
            opacity: 1;
        }
        .stage-lights {
            position: absolute;
            inset: 10px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 5px;
            pointer-events: none;
        }
        .stage-lights span {
            min-height: 6px;
            border-radius: 2px;
            background: color-mix(in srgb, var(--accent) 42%, transparent);
            box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 38%, transparent);
            animation: lightChase 1200ms linear infinite;
        }
        .stage-lights span:nth-child(2n) {
            background: color-mix(in srgb, var(--accent-2) 42%, transparent);
            animation-delay: 120ms;
        }
        .stage-lights span:nth-child(3n) {
            background: color-mix(in srgb, var(--accent-3) 42%, transparent);
            animation-delay: 240ms;
        }
        .reel-window {
            position: absolute;
            left: 18px;
            top: 50%;
            display: grid;
            grid-template-columns: repeat(3, 42px);
            gap: 8px;
            transform: translateY(-50%);
            z-index: 2;
        }
        .reel-window span {
            height: 52px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 6px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02)),
                rgba(0,0,0,0.58);
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 12px rgba(255,255,255,0.7);
            box-shadow: inset 0 0 16px rgba(0,0,0,0.55);
        }
        .machine-stage.effect-spin .reel-window span {
            animation: reelTick 480ms steps(2, end) infinite;
        }
        .effect-copy {
            position: absolute;
            inset: 0 18px 0 160px;
            z-index: 2;
            display: grid;
            align-content: center;
            justify-items: end;
            text-align: right;
            gap: 4px;
        }
        .effect-title {
            color: #fff;
            font-size: 30px;
            font-weight: 900;
            line-height: 1.1;
            text-shadow:
                0 0 18px color-mix(in srgb, var(--accent) 70%, transparent),
                0 2px 0 rgba(0,0,0,0.35);
        }
        .effect-subtitle {
            color: rgba(255,255,255,0.78);
            font-size: 14px;
            min-height: 20px;
        }
        .effect-meter {
            display: grid;
            grid-template-columns: repeat(8, 12px);
            gap: 4px;
            margin-top: 6px;
        }
        .effect-meter span {
            height: 16px;
            border-radius: 2px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.12);
        }
        .machine-stage.effect-spin .effect-meter span,
        .machine-stage.effect-chance .effect-meter span,
        .machine-stage.effect-rush .effect-meter span,
        .machine-stage.effect-hit .effect-meter span,
        .machine-stage.effect-chain .effect-meter span,
        .machine-stage.effect-charge .effect-meter span,
        .machine-stage.effect-jitan .effect-meter span,
        .machine-stage.effect-final-plus .effect-meter span {
            animation: meterPulse 900ms ease infinite;
        }
        .effect-meter span:nth-child(2) { animation-delay: 80ms; }
        .effect-meter span:nth-child(3) { animation-delay: 160ms; }
        .effect-meter span:nth-child(4) { animation-delay: 240ms; }
        .effect-meter span:nth-child(5) { animation-delay: 320ms; }
        .effect-meter span:nth-child(6) { animation-delay: 400ms; }
        .effect-meter span:nth-child(7) { animation-delay: 480ms; }
        .effect-meter span:nth-child(8) { animation-delay: 560ms; }
        .machine-stage.effect-hit,
        .machine-stage.effect-chain,
        .machine-stage.effect-rush,
        .machine-stage.effect-charge,
        .machine-stage.effect-final-plus {
            animation: stageHit 620ms ease;
        }
        .machine-stage.effect-final-minus {
            filter: grayscale(0.35);
        }
        .status-line {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #0f0;
            margin-bottom: 10px;
        }
        .rotation-display {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            transition: color 180ms ease, text-shadow 180ms ease, transform 180ms ease;
        }
        .display.is-impact .rotation-display {
            color: var(--accent-3);
            text-shadow: 0 0 28px color-mix(in srgb, var(--accent-3) 78%, transparent);
            transform: scale(1.04);
        }
        .rotation-label {
            text-align: center;
            color: #888;
            margin-top: 5px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stat-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.18), transparent 66%);
            transform: translateX(-120%);
        }
        .stat-box.stat-pop::after {
            animation: statSweep 520ms ease;
        }
        .stat-box.stat-pop {
            animation: statPop 520ms ease;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
        }
        .profit-plus { color: #4ecdc4; }
        .profit-minus { color: #ff6b6b; }
        .log {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent),
                rgba(0,0,0,0.62);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: inset 0 0 26px rgba(0,0,0,0.46);
        }
        .log-entry {
            border-left: 3px solid transparent;
            padding: 2px 0 2px 8px;
            margin-bottom: 3px;
            animation: logPop 220ms ease;
        }
        .log-entry:nth-last-child(1) {
            background: rgba(255,255,255,0.035);
        }
        .log-hit {
            color: #ffd93d;
            font-weight: bold;
            border-left-color: #ffd93d;
        }
        .log-st {
            color: var(--accent);
            border-left-color: var(--accent);
        }
        .log-chain {
            color: #4ecdc4;
            padding-left: 20px;
            border-left-color: #4ecdc4;
        }
        .log-jitan {
            color: #a855f7;
            border-left-color: #a855f7;
        }
        .log-charge {
            color: #f59e0b;
            border-left-color: #f59e0b;
        }
        .state-normal { color: #4ecdc4; }
        .state-st { color: #ff6b6b; }
        .state-jitan { color: #a855f7; }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .speed-control input[type="range"] {
            flex: 1;
        }
        .cumulative-stats {
            background: linear-gradient(135deg, #1e3a5f, #0d1b2a);
            border: 2px solid #4ecdc4;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .cumulative-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #4ecdc4;
        }
        .btn-reset {
            background: rgba(255,255,255,0.1);
            border: 1px solid #666;
            color: #888;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-reset:hover {
            background: rgba(255,100,100,0.2);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .cumulative-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .cumulative-item {
            text-align: center;
        }
        .cumulative-value {
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        .cumulative-label {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }
        .cum-plus { color: #4ecdc4; }
        .cum-minus { color: #ff6b6b; }
        .stats-panels {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stats-panels .cumulative-stats {
            flex: 1;
            margin-bottom: 0;
        }
        .ranking-panel {
            flex: 1;
            background: linear-gradient(135deg, #3d2a1e, #1a1a2e);
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 15px;
        }
        .ranking-panel .cumulative-header {
            color: #f59e0b;
        }
        .ranking-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .ranking-item {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .ranking-item.best {
            border-left: 3px solid #4ecdc4;
        }
        .ranking-item.worst {
            border-left: 3px solid #ff6b6b;
        }
        .ranking-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }
        .ranking-value {
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #f59e0b;
        }
        .ranking-item.best .ranking-value { color: #4ecdc4; }
        .ranking-item.worst .ranking-value { color: #ff6b6b; }

        /* カレンダー */
        .calendar-panel {
            background: linear-gradient(135deg, #1a2a3a, #0d1b2a);
            border: 2px solid #667788;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            color: #4ecdc4;
            font-weight: bold;
        }
        .calendar-nav {
            background: #334455;
            border: none;
            color: #ccc;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .calendar-nav:hover { background: #445566; }
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 5px;
        }
        .weekday {
            text-align: center;
            font-size: 12px;
            color: #888;
            padding: 5px 0;
        }
        .weekday.sun { color: #ff6b6b; }
        .weekday.sat { color: #66aaff; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .calendar-day {
            background: #1e2e3e;
            border-radius: 5px;
            padding: 5px;
            min-height: 50px;
            font-size: 11px;
        }
        .calendar-day.empty { background: transparent; }
        .calendar-day.today { border: 1px solid #4ecdc4; }
        .calendar-day .day-num {
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
        }
        .calendar-day.sun .day-num { color: #ff6b6b; }
        .calendar-day.sat .day-num { color: #66aaff; }
        .calendar-day .day-profit {
            font-size: 11px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        .calendar-day .day-profit.plus { color: #4ecdc4; }
        .calendar-day .day-profit.minus { color: #ff6b6b; }
        .calendar-day .day-count {
            font-size: 9px;
            color: #666;
        }
        .calendar-summary {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #334;
            font-size: 14px;
        }
        .calendar-summary .plus { color: #4ecdc4; }
        .calendar-summary .minus { color: #ff6b6b; }
        @media (max-width: 600px) {
            .stats-panels {
                flex-direction: column;
            }
            .cumulative-grid, .ranking-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .final-result {
            background:
                linear-gradient(135deg, rgba(255,255,255,0.08), transparent 36%),
                linear-gradient(135deg, #2d2d44, #1a1a2e);
            border: 2px solid var(--accent);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 18px 40px rgba(0,0,0,0.28);
            animation: resultIn 420ms ease;
        }
        .final-result.result-win {
            border-color: #4ecdc4;
            box-shadow: 0 18px 44px rgba(78,205,196,0.2);
        }
        .final-result.result-loss {
            border-color: #ff6b6b;
            box-shadow: 0 18px 44px rgba(255,107,107,0.18);
        }
        .final-result h2 {
            color: var(--accent);
            margin-bottom: 20px;
        }
        .final-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .final-stat {
            padding: 10px;
        }
        .final-stat-value {
            font-size: 28px;
            font-weight: bold;
        }
        .final-stat-label {
            color: #888;
            font-size: 14px;
        }
        @keyframes stageSweep {
            from { transform: translateX(-55%); }
            to { transform: translateX(55%); }
        }
        @keyframes cutInRush {
            0% { opacity: 0; transform: translateX(-120%) skewX(-10deg); }
            18% { opacity: 1; transform: translateX(0) skewX(-10deg); }
            78% { opacity: 1; transform: translateX(0) skewX(-10deg); }
            100% { opacity: 0; transform: translateX(120%) skewX(-10deg); }
        }
        @keyframes burstPiece {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(0deg) scale(0.45);
            }
            12% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform:
                    translate(calc(-50% + var(--x)), calc(-50% + var(--y)))
                    rotate(var(--r))
                    scale(1);
            }
        }
        @keyframes lightChase {
            0%, 100% { opacity: 0.18; transform: scaleY(0.7); }
            50% { opacity: 1; transform: scaleY(1.2); }
        }
        @keyframes reelTick {
            0%, 100% { transform: translateY(0); filter: brightness(1); }
            50% { transform: translateY(-3px); filter: brightness(1.35); }
        }
        @keyframes meterPulse {
            0%, 100% { background: rgba(255,255,255,0.12); }
            50% {

        @keyframes logPop {

        }
        @keyframes resultIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 600px) {
            body {
                padding: 14px;

    <script>
        // 15賞球は入賞1発を差し引き、純増14発/カウントで計算する
        const netPayout = (grossPayout) => Math.round(grossPayout * 14 / 15);

        // 機種スペック

                chargePayout: 0,

                isLT: true,              // 継続率システム（内部フラグ）
                ltChallengeRate: 0,      // 突入率50%はヘソ振り分けで表現済み
                ltFirstPayout: 0,        // 追加出玉なし
                ltEndPayout: 1750,       // 転落時も15R
                stContinueRate: 0.82     // 魔戒チャンス継続率82%
            },
            garo12: {
                name: "黄金騎士12",

                stHitProb: 1.0,
                hesoPayouts: [

                    { prob: 0.50, payout: 1400, st: false }
                ],
                denchuPayout: 0,  // 振り分けありの場合は使用しない

                    { prob: 0.329, payout: 7000 },  // 継続時約33%で7000発
                    { prob: 0.671, payout: 1400 }   // 継続時約67%で1400発
                ],

            ghoul: {

                hesoPayouts: [
                    { prob: 0.50, payout: netPayout(1500), st: true },   // 1,500個払い出し → 純増1,400発
                    { prob: 0.49, payout: netPayout(1500), st: false },  // 1,500個払い出し → 純増1,400発
                    { prob: 0.01, payout: netPayout(300), st: true }     // 300個払い出し → 純増280発
                ],

                    { prob: 0.97, payout: netPayout(3000) }   // 3,000個払い出し → 純増2,800発
                ],

                ltChallengeRate: 0,        // 突入率51%はヘソ振り分けで表現済み

            }
        };

        // 機種別RUSH名称を取得
        function getRushName(machineKey) {
            const rushNames = {
                eva15: 'インパクトモード',
                eva17: 'インパクトモード',
                garo: '魔戒チャンス',
                garo12: '魔戒チャンスLT',
                ghoul: 'HYPER喰種RUSH'
            };
            return rushNames[machineKey] || 'RUSH';
        }

        // 機種別チャレンジ名称を取得（LT突入バトル）
        function getChallengeName(machineKey) {
            const challengeNames = {
                garo: 'キババトル',
                garo12: '極限バトル',
                ghoul: '喰種バトル'
            };
            return challengeNames[machineKey] || 'LTチャレンジ';
        }

        let isRunning = false;
        let shouldStop = false;
        let currentTotalSpins = 0;
        let lastRotations = 0;
        let effectTimer = null;
        let cutInTimer = null;
        let currentStageMode = {
            type: 'idle',
            title: 'READY',
            subtitle: '待機中'
        };

        function getProgressText() {
            if (!currentTotalSpins) return '待機中';
            return `${lastRotations.toLocaleString()} / ${currentTotalSpins.toLocaleString()}回転`;
        }

        function setMachineTheme(machineKey) {
            document.body.dataset.machine = machineKey;
        }

        function setStage(type, title, subtitle = '') {
            const stage = document.getElementById('machineStage');
            const titleEl = document.getElementById('effectTitle');
            const subtitleEl = document.getElementById('effectSubtitle');

            stage.dataset.effect = type;
            stage.className = `machine-stage effect-${type}`;
            titleEl.textContent = title;
            subtitleEl.textContent = subtitle;
        }

        function restoreStageMode() {
            const subtitle = currentStageMode.type === 'spin'
                ? getProgressText()
                : currentStageMode.subtitle;
            setStage(currentStageMode.type, currentStageMode.title, subtitle);
        }

        function setStageMode(type, title, subtitle = '') {
            currentStageMode = { type, title, subtitle };
            restoreStageMode();
        }

        function pulseDisplay() {
            const display = document.querySelector('.display');
            display.classList.remove('is-impact');
            void display.offsetWidth;
            display.classList.add('is-impact');
        }

        function flashStat(elementId) {
            const statBox = document.getElementById(elementId)?.closest('.stat-box');
            if (!statBox) return;
            statBox.classList.remove('stat-pop');
            void statBox.offsetWidth;
            statBox.classList.add('stat-pop');
        }

        function showCutIn(title, subtitle = '', type = 'hit') {
            const cutIn = document.getElementById('cutIn');
            document.getElementById('cutInTitle').textContent = title;
            document.getElementById('cutInSubtitle').textContent = subtitle;

            clearTimeout(cutInTimer);
            cutIn.className = `cut-in cut-in-${type}`;
            void cutIn.offsetWidth;
            cutIn.classList.add('show');
            cutInTimer = setTimeout(() => {
                cutIn.classList.remove('show');
            }, 1180);
        }

        function spawnBurst(type = 'hit', count = 22) {
            const layer = document.getElementById('burstLayer');
            const palette = type === 'final-minus'
                ? ['#ff6b6b', '#a855f7', '#ffffff']
                : ['#ffd93d', '#ff6b6b', '#4ecdc4', '#ffffff'];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');
                const angle = (Math.PI * 2 * i / count) + Math.random() * 0.55;
                const distance = 92 + Math.random() * 170;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                const color = palette[i % palette.length];

                piece.className = 'burst-piece';
                piece.style.setProperty('--x', `${x.toFixed(1)}px`);
                piece.style.setProperty('--y', `${y.toFixed(1)}px`);
                piece.style.setProperty('--r', `${Math.floor(Math.random() * 420 - 210)}deg`);
                piece.style.setProperty('--delay', `${Math.floor(Math.random() * 80)}ms`);
                piece.style.setProperty('--w', `${6 + Math.floor(Math.random() * 8)}px`);
                piece.style.setProperty('--h', `${16 + Math.floor(Math.random() * 26)}px`);
                piece.style.setProperty('--piece-color', color);
                layer.appendChild(piece);
                setTimeout(() => piece.remove(), 1100);
            }
        }

        function dramatizeEffect(type, title, subtitle) {
            const chainNumber = type === 'chain' ? parseInt(title, 10) : 0;
            const shouldCutIn = ['hit', 'rush', 'charge', 'final-plus', 'final-minus'].includes(type)
                || (type === 'chain' && chainNumber >= 5);

            if (!shouldCutIn) return;

            showCutIn(title, subtitle, type);
            const burstCount = type === 'chain' ? 16 : type === 'final-minus' ? 10 : 28;
            spawnBurst(type, burstCount);
        }

        function playEffect(type, title, subtitle = '', duration = 1100) {
            clearTimeout(effectTimer);
            setStage(type, title, subtitle);
            dramatizeEffect(type, title, subtitle);
            pulseDisplay();
            if (duration > 0) {
                effectTimer = setTimeout(() => {
                    if (isRunning) {
                        restoreStageMode();
                    }
                }, duration);
            }
        }

        function updateReels(rotations) {
            const digits = String(rotations % 1000).padStart(3, '0');
            document.getElementById('reelLeft').textContent = digits[0];
            document.getElementById('reelCenter').textContent = digits[1];
            document.getElementById('reelRight').textContent = digits[2];
        }

        function updateStageProgress() {
            const stage = document.getElementById('machineStage');
            updateReels(lastRotations);
            if (stage.dataset.effect === 'spin') {
                document.getElementById('effectSubtitle').textContent = getProgressText();
            }
        }

        // ========================================
        // 累計収支管理（localStorage）
        // ========================================
        const STORAGE_KEY = 'pachinko_cumulative_stats';

        function loadCumulativeStats() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                return JSON.parse(data);
            }
            return { sessions: 0, invest: 0, payout: 0 };
        }

        function saveCumulativeStats(stats) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
        }

        function getUniqueDaysCount() {
            const history = loadSessionHistory();
            const uniqueDates = new Set(history.map(s => s.date));
            return uniqueDates.size;
        }

        function updateCumulativeDisplay() {
            const stats = loadCumulativeStats();
            const profit = Math.floor(stats.payout * 4) - stats.invest;  // 等価換算
            const days = getUniqueDaysCount();
            const dailyAvg = days > 0 ? Math.round(profit / days) : 0;

            document.getElementById('cumSessions').textContent = stats.sessions;
            document.getElementById('cumInvest').textContent = stats.invest.toLocaleString() + '円';
            document.getElementById('cumPayout').textContent = stats.payout.toLocaleString() + '発';

            const profitEl = document.getElementById('cumProfit');
            if (profit >= 0) {
                profitEl.textContent = '+' + profit.toLocaleString() + '円';
                profitEl.className = 'cumulative-value cum-plus';
            } else {
                profitEl.textContent = profit.toLocaleString() + '円';
                profitEl.className = 'cumulative-value cum-minus';
            }

            // 稼働日数
            document.getElementById('cumDays').textContent = days + '日';

            // 平均収支/日
            const dailyAvgEl = document.getElementById('cumDailyAvg');
            if (dailyAvg >= 0) {
                dailyAvgEl.textContent = '+' + dailyAvg.toLocaleString() + '円';
                dailyAvgEl.className = 'cumulative-value cum-plus';
            } else {
                dailyAvgEl.textContent = dailyAvg.toLocaleString() + '円';
                dailyAvgEl.className = 'cumulative-value cum-minus';
            }
        }

        function addSessionResult(invest, payout) {
            // 累計収支更新
            const stats = loadCumulativeStats();
            stats.sessions++;
            stats.invest += invest;
            stats.payout += payout;
            saveCumulativeStats(stats);

            // セッション履歴にも追加
            addSessionToHistory(invest, payout);
            updateCumulativeDisplay();
            // 最新セッションの月にカレンダーを移動
            moveToLatestSession();
            renderCalendar();
        }

        function resetCumulativeStats() {
            if (confirm('累計収支をリセットしますか？')) {
                localStorage.removeItem(STORAGE_KEY);
                updateCumulativeDisplay();
            }
        }

        // ========================================
        // セッション履歴管理（カレンダー用）
        // ========================================
        const HISTORY_KEY = 'pachinko_session_history';

        function loadSessionHistory() {
            const data = localStorage.getItem(HISTORY_KEY);
            if (data) {
                return JSON.parse(data);
            }
            return [];
        }

        // 既存データを仮想日付に変換（マイグレーション）
        function migrateToVirtualDates() {
            const history = loadSessionHistory();
            if (history.length === 0) return;

            // 最初のセッションの日付が2026-01-01でなければマイグレーション実行
            if (history[0].date !== '2026-01-01') {
                const baseDate = new Date(2026, 0, 1);
                history.forEach((session, index) => {
                    const virtualDate = new Date(baseDate);
                    virtualDate.setDate(baseDate.getDate() + index);
                    session.date = virtualDate.toISOString().split('T')[0];
                    session.day = index + 1;
                });
                saveSessionHistory(history);
            }
        }

        function saveSessionHistory(history) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function addSessionToHistory(invest, payout) {
            const history = loadSessionHistory();
            // 仮想日付: 1回の稼働 = 1日として記録
            // 開始日を2026-01-01として、セッション数に応じて日付を進める
            const baseDate = new Date(2026, 0, 1); // 2026-01-01
            const dayNumber = history.length; // 0から始まるので、これが経過日数
            const virtualDate = new Date(baseDate);
            virtualDate.setDate(baseDate.getDate() + dayNumber);
            const dateStr = virtualDate.toISOString().split('T')[0];

            const profit = Math.round((payout * 4) - invest);
            history.push({
                date: dateStr,
                day: dayNumber + 1, // 1日目、2日目...
                invest: invest,
                payout: payout,
                profit: profit,
                machine: document.getElementById('machine').value
            });
            saveSessionHistory(history);
        }

        function getHistoryByDate(dateStr) {
            return loadSessionHistory().filter(s => s.date === dateStr);
        }

        function getHistoryByMonth(year, month) {
            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            return loadSessionHistory().filter(s => s.date.startsWith(prefix));
        }

        function resetSessionHistory() {
            if (confirm('セッション履歴をリセットしますか？\n（累計収支・ランキングも同時にリセットされます）')) {
                localStorage.removeItem(HISTORY_KEY);
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(RANKING_KEY);
                updateCumulativeDisplay();
                updateRankingDisplay();
                renderCalendar();
            }
        }

        // ========================================
        // カレンダー表示
        // ========================================
        // 初期表示は2026年1月（仮想開始月）
        let currentYear = 2026;
        let currentMonth = 0;

        function moveToLatestSession() {
            const history = loadSessionHistory();
            if (history.length > 0) {
                const latestDate = history[history.length - 1].date;
                const [year, month] = latestDate.split('-').map(Number);
                currentYear = year;
                currentMonth = month - 1; // 0-indexed
            }
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function renderCalendar() {
            const titleEl = document.getElementById('calendarTitle');
            const gridEl = document.getElementById('calendarGrid');
            const monthSessionsEl = document.getElementById('monthSessions');
            const monthProfitEl = document.getElementById('monthProfit');

            titleEl.textContent = `${currentYear}年${currentMonth + 1}月`;

            // 月の最初の日と最後の日
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startDayOfWeek = firstDay.getDay();

            // 最新セッションの日付をハイライト
            const allHistory = loadSessionHistory();
            const latestDateStr = allHistory.length > 0 ? allHistory[allHistory.length - 1].date : null;

            // 月のセッション履歴を取得
            const monthHistory = getHistoryByMonth(currentYear, currentMonth);

            // 日別に集計
            const dailyStats = {};
            monthHistory.forEach(s => {
                if (!dailyStats[s.date]) {
                    dailyStats[s.date] = { count: 0, profit: 0 };
                }
                dailyStats[s.date].count++;
                dailyStats[s.date].profit += s.profit;
            });

            // グリッドをクリア（安全なDOM操作）
            while (gridEl.firstChild) {
                gridEl.removeChild(gridEl.firstChild);
            }

            // 空のセル（月初の曜日調整）
            for (let i = 0; i < startDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                gridEl.appendChild(emptyCell);
            }

            // 各日のセル
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayOfWeek = (startDayOfWeek + day - 1) % 7;
                const isLatest = dateStr === latestDateStr;

                const cell = document.createElement('div');
                let cellClass = 'calendar-day';
                if (dayOfWeek === 0) cellClass += ' sun';
                if (dayOfWeek === 6) cellClass += ' sat';
                if (isLatest) cellClass += ' today';
                cell.className = cellClass;

                // 日付番号
                const dayNum = document.createElement('div');
                dayNum.className = 'day-num';
                dayNum.textContent = day;
                cell.appendChild(dayNum);

                // その日のデータがあれば表示
                const stats = dailyStats[dateStr];
                if (stats) {
                    const profitDiv = document.createElement('div');
                    profitDiv.className = 'day-profit ' + (stats.profit >= 0 ? 'plus' : 'minus');
                    profitDiv.textContent = (stats.profit >= 0 ? '+' : '') + (stats.profit / 1000).toFixed(0) + 'k';
                    cell.appendChild(profitDiv);

                    if (stats.count > 1) {
                        const countDiv = document.createElement('div');
                        countDiv.className = 'day-count';
                        countDiv.textContent = stats.count + '回';
                        cell.appendChild(countDiv);
                    }
                }

                gridEl.appendChild(cell);
            }

            // 月間サマリー
            const monthTotalSessions = monthHistory.length;
            const monthTotalProfit = monthHistory.reduce((sum, s) => sum + s.profit, 0);
            monthSessionsEl.textContent = monthTotalSessions;
            monthProfitEl.textContent = (monthTotalProfit >= 0 ? '+' : '') + monthTotalProfit.toLocaleString() + '円';
            monthProfitEl.className = monthTotalProfit >= 0 ? 'plus' : 'minus';
        }

        // ページ読み込み時に累計表示を更新
        document.addEventListener('DOMContentLoaded', function() {
            migrateToVirtualDates();  // 古いデータを仮想日付に変換
            updateCumulativeDisplay();
            moveToLatestSession();
            renderCalendar();
        });

        // ========================================
        // ランキング管理（localStorage）
        // ========================================
        const RANKING_KEY = 'pachinko_ranking_stats';

        function loadRankingStats() {
            const data = localStorage.getItem(RANKING_KEY);
            if (data) {
                return JSON.parse(data);
            }
            return {
                bestProfit: null,
                worstProfit: null,
                maxChain: null,
                maxPayout: null
            };
        }

        function saveRankingStats(stats) {
            localStorage.setItem(RANKING_KEY, JSON.stringify(stats));
        }

        function updateRankingDisplay() {
            const stats = loadRankingStats();

            const bestEl = document.getElementById('rankBestProfit');
            const worstEl = document.getElementById('rankWorstProfit');
            const chainEl = document.getElementById('rankMaxChain');
            const payoutEl = document.getElementById('rankMaxPayout');

            bestEl.textContent = stats.bestProfit !== null
                ? '+' + stats.bestProfit.toLocaleString() + '円' : '---';
            worstEl.textContent = stats.worstProfit !== null
                ? stats.worstProfit.toLocaleString() + '円' : '---';
            chainEl.textContent = stats.maxChain !== null
                ? stats.maxChain + '連' : '---';
            payoutEl.textContent = stats.maxPayout !== null
                ? stats.maxPayout.toLocaleString() + '発' : '---';
        }

        function updateRankingWithResult(profit, maxChain, totalPayout) {
            const stats = loadRankingStats();
            let updated = false;

            // 最高収支（プラスの記録のみ）
            if (profit > 0 && (stats.bestProfit === null || profit > stats.bestProfit)) {
                stats.bestProfit = profit;
                updated = true;
            }

            // 最低収支（マイナスの記録のみ）
            if (profit < 0 && (stats.worstProfit === null || profit < stats.worstProfit)) {
                stats.worstProfit = profit;
                updated = true;
            }

            // 最大連チャン
            if (stats.maxChain === null || maxChain > stats.maxChain) {
                stats.maxChain = maxChain;
                updated = true;
            }

            // 一撃最高出玉
            if (stats.maxPayout === null || totalPayout > stats.maxPayout) {
                stats.maxPayout = totalPayout;
                updated = true;
            }

            if (updated) {
                saveRankingStats(stats);
                updateRankingDisplay();
            }

            return updated;
        }

        function resetRankingStats() {
            if (confirm('個人記録をリセットしますか？')) {
                localStorage.removeItem(RANKING_KEY);
                updateRankingDisplay();
            }
        }

        // ページ読み込み時にランキング表示を更新
        document.addEventListener('DOMContentLoaded', updateRankingDisplay);

        // 電チュー出玉を取得（振り分けがある場合は確率で選択）
        function getDenchuPayout(spec) {
            if (spec.denchuPayouts && spec.denchuPayouts.length > 0) {
                const r = Math.random();
                let cumulative = 0;
                for (const item of spec.denchuPayouts) {
                    cumulative += item.prob;
                    if (r < cumulative) {
                        return item.payout;
                    }
                }
                return spec.denchuPayouts[spec.denchuPayouts.length - 1].payout;
            }
            return spec.denchuPayout;
        }

        function drawNormalOutcome(spec) {
            const chargeProb = spec.chargeProb || 0;
            const roll = Math.random();
            if (roll < spec.hitProb) return 'hit';
            if (roll < spec.hitProb + chargeProb) return 'charge';
            return 'none';
        }

        // UI更新
        function updateDisplay(rotations, balls, investment) {
            lastRotations = rotations;
            document.getElementById('rotationDisplay').textContent = rotations.toLocaleString();
            document.getElementById('ballsDisplay').textContent = Math.floor(balls).toLocaleString();
            document.getElementById('investDisplay').textContent = investment.toLocaleString();

            const profit = Math.floor(balls * 4) - investment;
            const profitEl = document.getElementById('profitDisplay');
            profitEl.textContent = (profit >= 0 ? '+' : '') + profit.toLocaleString();
            profitEl.className = 'stat-value ' + (profit >= 0 ? 'profit-plus' : 'profit-minus');
            updateStageProgress();
        }

        function setState(state, extra = '') {
            const el = document.getElementById('stateDisplay');
            let text = state;
            let className = 'state-normal';
            let stageType = 'idle';
            let stageTitle = state;
            let stageSubtitle = extra;

            if (state === '通常') {
                className = 'state-normal';
                stageType = 'spin';
                stageTitle = '通常回転';
                stageSubtitle = getProgressText();
            } else if (state === 'ST' || state === 'LT') {
                className = 'state-st';
                text = `${state} ${extra}`;
                stageType = 'rush';
                stageTitle = state;
                stageSubtitle = extra;
            } else if (state === '時短') {
                className = 'state-jitan';
                text = `時短 ${extra}`;
                stageType = 'jitan';
                stageTitle = '時短';
                stageSubtitle = extra;
            } else if (state.includes('バトル') || state.includes('チャレンジ')) {
                className = 'state-jitan';
                stageType = 'chance';
                stageTitle = state;
                stageSubtitle = extra || '突入判定';
            } else if (state.includes('RUSH') || state.includes('モード') || state.includes('チャンス')) {
                className = 'state-st';
                stageType = 'rush';
                stageTitle = state;
                stageSubtitle = extra;
            } else if (state === '終了') {
                className = 'state-normal';
                stageType = 'idle';
                stageTitle = 'FINISH';
                stageSubtitle = '結果表示';
            }

            el.textContent = text;
            el.className = className;
            setStageMode(stageType, stageTitle, stageSubtitle);
        }

        function addLog(message, className = '') {
            const log = document.getElementById('log');
            const div = document.createElement('div');
            div.textContent = message;
            div.className = className ? `log-entry ${className}` : 'log-entry';
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function getHesoResult(spec) {
            const r = Math.random();
            let cumulative = 0;
            for (const p of spec.hesoPayouts) {
                cumulative += p.prob;
                if (r < cumulative) {
                    return { payout: p.payout, st: p.st };
                }
            }
            const last = spec.hesoPayouts[spec.hesoPayouts.length - 1];
            return { payout: last.payout, st: last.st };
        }

        async function startSimulation() {
            if (isRunning) {
                shouldStop = true;
                return;
            }

            isRunning = true;
            shouldStop = false;

            const btn = document.getElementById('startBtn');
            btn.textContent = '停止';
            btn.style.background = 'linear-gradient(135deg, #666, #444)';

            const machineKey = document.getElementById('machine').value;
            const spec = SPECS[machineKey];
            const totalSpins = parseInt(document.getElementById('totalSpins').value);
            const rotation1k = parseInt(document.getElementById('rotation1k').value);
            const speedValue = parseInt(document.getElementById('speed').value);
            currentTotalSpins = totalSpins;
            lastRotations = 0;
            setMachineTheme(machineKey);
            setStageMode('spin', '通常回転', getProgressText());

            const ballsPer1k = 250;
            const ballsPerSpin = ballsPer1k / rotation1k;
            const ballsPerSpinJitan = ballsPer1k / spec.jitanRotation1k;

            // 速度設定（値が大きいほど速い）
            const baseDelay = Math.max(5, 100 - speedValue * 10);

            clearLog();
            const finalResult = document.getElementById('finalResult');
            finalResult.style.display = 'none';
            finalResult.className = 'final-result';
            addLog(`【${spec.name}】シミュレーション開始`);
            addLog(`条件: 1k${rotation1k}回転 / ${totalSpins}回転`);
            addLog('─'.repeat(30));

            let rotations = 0;
            let myBalls = 0;
            let totalInvestment = 0;
            let hitCount = 0;
            let maxSessionChain = 0;  // セッション中の最大連チャン
            let maxSessionPayout = 0; // セッション中の一撃最高出玉

            function consumeBalls(amount) {
                if (myBalls >= amount) {
                    myBalls -= amount;
                } else {
                    const shortage = amount - myBalls;
                    myBalls = 0;
                    const investUnits = Math.ceil(shortage / ballsPer1k);
                    totalInvestment += investUnits * 1000;
                    myBalls += investUnits * ballsPer1k - shortage;
                }
            }

            // メインループ
            while (rotations < totalSpins && !shouldStop) {
                let spinsToHit = 0;
                let chargeBousou = false;
                let figureHit = false;

                // 通常状態
                setState('通常');
                while (rotations < totalSpins && !shouldStop) {
                    rotations++;
                    spinsToHit++;
                    consumeBalls(ballsPerSpin);

                    if (rotations % 10 === 0) {
                        updateDisplay(rotations, myBalls, totalInvestment);
                        await sleep(baseDelay / 5);
                    }

                    const normalOutcome = drawNormalOutcome(spec);

                    // チャージ
                    if (normalOutcome === 'charge') {
                        myBalls += spec.chargePayout;
                        addLog(`⚡ チャージ！ +${spec.chargePayout}発`, 'log-charge');
                        playEffect('charge', 'CHARGE', `+${spec.chargePayout.toLocaleString()}発`, 900);
                        flashStat('ballsDisplay');
                        if (Math.random() < spec.chargeStRate) {
                            chargeBousou = true;
                            addLog(`🔥🔥🔥 暴走モード！${getRushName(machineKey)}突入！ 🔥🔥🔥`, 'log-charge');
                            playEffect('rush', '暴走', `${getRushName(machineKey)}突入`, 1200);
                            await sleep(baseDelay * 5);
                            break;
                        }
                    }

                    // 当たり判定
                    if (normalOutcome === 'hit') {
                        figureHit = true;
                        break;
                    }
                }

                if (shouldStop) break;
                if (!chargeBousou && !figureHit) break;

                hitCount++;
                updateDisplay(rotations, myBalls, totalInvestment);

                // 初当たり処理
                let firstPayout, stEntered;
                if (chargeBousou) {
                    firstPayout = spec.chargePayout;
                    stEntered = true;
                    addLog(`🎰【当たり${hitCount}】暴走から${getRushName(machineKey)}突入！`, 'log-hit');
                    playEffect('hit', '大当り', getRushName(machineKey), 1300);
                } else {
                    const result = getHesoResult(spec);
                    firstPayout = result.payout;
                    stEntered = result.st;
                    myBalls += firstPayout;
                    addLog(`🎰【当たり${hitCount}】${spinsToHit}回転目 +${firstPayout.toLocaleString()}発`, 'log-hit');
                    playEffect('hit', '大当り', `${spinsToHit}回転目 +${firstPayout.toLocaleString()}発`, 1300);
                }
                flashStat('ballsDisplay');
                flashStat('profitDisplay');
                maxSessionChain = Math.max(maxSessionChain, 1);
                maxSessionPayout = Math.max(maxSessionPayout, firstPayout);

                await sleep(baseDelay * 3);

                if (stEntered) {
                    // ST/LT処理
                    const stLabel = spec.isLT ? 'LT' : 'ST';
                    const isLtChallenge = spec.ltChallengeRate > 0;
                    let chainCount = 1;
                    let chainPayout = firstPayout;

                    if (isLtChallenge) {
                        // チャレンジ機種の場合（牙狼系・喰種）
                        const challengeName = getChallengeName(machineKey);
                        const rushName = getRushName(machineKey);
                        addLog(`>>> ${challengeName}！`, 'log-st');
                        setState(challengeName);
                        playEffect('chance', challengeName, '突入判定', 1200);
                        await sleep(baseDelay * 5);

                        // チャレンジ判定
                        if (Math.random() >= spec.ltChallengeRate) {
                            // チャレンジ敗北
                            myBalls += spec.ltEndPayout;
                            chainPayout += spec.ltEndPayout;
                            updateDisplay(rotations, myBalls, totalInvestment);
                            addLog(`  ${challengeName}敗北... +${spec.ltEndPayout.toLocaleString()}発`, 'log-chain');
                            playEffect('chance', '敗北', `+${spec.ltEndPayout.toLocaleString()}発`, 1000);
                            flashStat('ballsDisplay');
                            await sleep(baseDelay * 3);
                            addLog(`終了 → 1連 計${chainPayout.toLocaleString()}発`, 'log-st');
                            maxSessionPayout = Math.max(maxSessionPayout, chainPayout);
                        } else {
                            // チャレンジ成功 → RUSH突入
                            addLog(`🔥 ${challengeName}勝利！ ${rushName}突入！`, 'log-st');
                            playEffect('rush', rushName, '突入', 1300);
                            myBalls += spec.ltFirstPayout;
                            chainPayout += spec.ltFirstPayout;
                            chainCount++;
                            updateDisplay(rotations, myBalls, totalInvestment);
                            addLog(`  ${rushName}突入: +${spec.ltFirstPayout.toLocaleString()}発`, 'log-chain');
                            flashStat('ballsDisplay');
                            await sleep(baseDelay * 4);
                            setState(rushName);

                            // RUSH継続ループ
                            while (!shouldStop && Math.random() < spec.stContinueRate) {
                                chainCount++;
                                const payout = getDenchuPayout(spec);
                                myBalls += payout;
                                chainPayout += payout;
                                updateDisplay(rotations, myBalls, totalInvestment);
                                addLog(`  ${chainCount}連目: ${rushName}継続 +${payout.toLocaleString()}発`, 'log-chain');
                                playEffect('chain', `${chainCount}連`, `+${payout.toLocaleString()}発`, 800);
                                flashStat('ballsDisplay');
                                await sleep(baseDelay * 4);
                            }

                            // RUSH転落
                            myBalls += spec.ltEndPayout;
                            chainPayout += spec.ltEndPayout;
                            updateDisplay(rotations, myBalls, totalInvestment);
                            addLog(`  ${rushName}転落 → +${spec.ltEndPayout.toLocaleString()}発`, 'log-chain');
                            flashStat('ballsDisplay');
                            await sleep(baseDelay * 2);
                            addLog(`${rushName}終了 → ${chainCount}連チャン！ 計${chainPayout.toLocaleString()}発`, 'log-st');
                            maxSessionChain = Math.max(maxSessionChain, chainCount);
                            maxSessionPayout = Math.max(maxSessionPayout, chainPayout);
                        }
                    } else {
                        // 通常ST/LT機種
                        const rushName = getRushName(machineKey);
                        addLog(`>>> ${rushName}突入！（${spec.stSpins}回転）`, 'log-st');
                        setState(rushName, `${spec.stSpins}回転`);
                        playEffect('rush', rushName, `${spec.stSpins}回転`, 1200);
                        await sleep(baseDelay * 5);

                        let stSpin = 1;
                        while (!shouldStop) {
                            if (spec.isLT) {
                                if (Math.random() >= spec.stContinueRate) break;
                                stSpin = 1;
                            } else {
                                let hitInSt = false;
                                for (stSpin = 1; stSpin <= spec.stSpins; stSpin++) {
                                    if (Math.random() < spec.stHitProb) {
                                        hitInSt = true;
                                        break;
                                    }
                                }
                                if (!hitInSt) break;
                            }

                            chainCount++;
                            const payout = getDenchuPayout(spec);
                            myBalls += payout;
                            chainPayout += payout;
                            updateDisplay(rotations, myBalls, totalInvestment);
                            const spinText = spec.isLT ? `${stLabel}1回転` : `ST${stSpin}回転`;
                            addLog(`  ${chainCount}連目: ${spinText} +${payout.toLocaleString()}発`, 'log-chain');
                            playEffect('chain', `${chainCount}連`, `+${payout.toLocaleString()}発`, 800);
                            flashStat('ballsDisplay');
                            await sleep(baseDelay * 4);
                        }

                        // LT転落時出玉
                        if (spec.ltEndPayout > 0) {
                            myBalls += spec.ltEndPayout;
                            chainPayout += spec.ltEndPayout;
                            updateDisplay(rotations, myBalls, totalInvestment);
                            addLog(`  LT転落 → +${spec.ltEndPayout.toLocaleString()}発`, 'log-chain');
                            flashStat('ballsDisplay');
                            await sleep(baseDelay * 2);
                        }

                        addLog(`${rushName}終了 → ${chainCount}連チャン！ 計${chainPayout.toLocaleString()}発`, 'log-st');
                        maxSessionChain = Math.max(maxSessionChain, chainCount);
                        maxSessionPayout = Math.max(maxSessionPayout, chainPayout);

                        // インパクトモード終了後の残保留チェック（eva15向け）
                        if (!spec.isLT && spec.zanhoCount > 0) {
                            addLog(`残保留チェック（${spec.zanhoCount}個）...`, 'log-jitan');
                            playEffect('chance', '残保留', `${spec.zanhoCount}個チェック`, 900);
                            await sleep(baseDelay * 2);

                            let zanhoHit = false;
                            for (let i = 0; i < spec.zanhoCount; i++) {
                                if (Math.random() < spec.hitProb) {
                                    zanhoHit = true;
                                    hitCount++;
                                    const payout = getDenchuPayout(spec);
                                    myBalls += payout;
                                    addLog(`✨ 残保留${i + 1}個目で当たり！ +${payout.toLocaleString()}発`, 'log-hit');
                                    playEffect('hit', '残保留当り', `+${payout.toLocaleString()}発`, 1200);
                                    updateDisplay(rotations, myBalls, totalInvestment);
                                    flashStat('ballsDisplay');

                                    // 再度インパクトモードへ
                                    const rushName = getRushName(machineKey);
                                    addLog(`>>> ${rushName}再突入！（${spec.stSpins}回転）`, 'log-st');
                                    setState(rushName, `${spec.stSpins}回転`);
                                    playEffect('rush', rushName, '再突入', 1200);
                                    await sleep(baseDelay * 5);

                                    chainCount = 1;
                                    chainPayout = payout;

                                    // 再度STループ
                                    while (!shouldStop) {
                                        let hitInSt = false;
                                        let stSpin2;
                                        for (stSpin2 = 1; stSpin2 <= spec.stSpins; stSpin2++) {
                                            if (Math.random() < spec.stHitProb) {
                                                hitInSt = true;
                                                break;
                                            }
                                        }
                                        if (!hitInSt) break;

                                        chainCount++;
                                        const p = getDenchuPayout(spec);
                                        myBalls += p;
                                        chainPayout += p;
                                        updateDisplay(rotations, myBalls, totalInvestment);
                                        addLog(`  ${chainCount}連目: ST${stSpin2}回転 +${p.toLocaleString()}発`, 'log-chain');
                                        playEffect('chain', `${chainCount}連`, `+${p.toLocaleString()}発`, 800);
                                        flashStat('ballsDisplay');
                                        await sleep(baseDelay * 4);
                                    }

                                    addLog(`${rushName}終了 → ${chainCount}連チャン！ 計${chainPayout.toLocaleString()}発`, 'log-st');
                                    maxSessionChain = Math.max(maxSessionChain, chainCount);
                                    maxSessionPayout = Math.max(maxSessionPayout, chainPayout);
                                    break;
                                }
                            }

                            if (!zanhoHit) {
                                addLog(`→ 通常状態へ`, 'log-jitan');
                            }
                        }
                    }
                } else {
                    // 時短処理
                    addLog(`→ 単発終了（時短${spec.jitanSpins}回転へ）`, 'log-jitan');
                    setState('時短', `0/${spec.jitanSpins}`);
                    playEffect('jitan', '時短', `${spec.jitanSpins}回転`, 900);
                    await sleep(baseDelay * 2);

                    let jitanSpinCount = 0;
                    let hitInJitan = false;

                    while (jitanSpinCount < spec.jitanSpins && rotations < totalSpins && !shouldStop) {
                        rotations++;
                        jitanSpinCount++;
                        consumeBalls(ballsPerSpinJitan);

                        if (jitanSpinCount % 20 === 0) {
                            updateDisplay(rotations, myBalls, totalInvestment);
                            setState('時短', `${jitanSpinCount}/${spec.jitanSpins}`);
                            await sleep(baseDelay / 3);
                        }

                        if (Math.random() < spec.hitProb) {
                            hitInJitan = true;
                            break;
                        }
                    }

                    if (hitInJitan) {
                        // 時短引き戻し
                        hitCount++;
                        const payout = getDenchuPayout(spec);
                        myBalls += payout;
                        addLog(`🎰【当たり${hitCount}】時短${jitanSpinCount}回転目で引き戻し！ +${payout.toLocaleString()}発`, 'log-hit');
                        playEffect('hit', '引き戻し', `時短${jitanSpinCount}回転目`, 1200);
                        updateDisplay(rotations, myBalls, totalInvestment);
                        flashStat('ballsDisplay');
                        await sleep(baseDelay * 3);

                        // RUSH突入
                        const rushName = getRushName(machineKey);
                        addLog(`>>> ${rushName}突入！（${spec.stSpins}回転）`, 'log-st');
                        setState(rushName, `${spec.stSpins}回転`);
                        playEffect('rush', rushName, `${spec.stSpins}回転`, 1200);
                        await sleep(baseDelay * 5);

                        let chainCount = 1;
                        let chainPayout = payout;

                        while (!shouldStop) {
                            let stSpin = 0;
                            let hitInSt = false;

                            for (stSpin = 1; stSpin <= spec.stSpins; stSpin++) {
                                if (Math.random() < spec.stHitProb) {
                                    hitInSt = true;
                                    break;
                                }
                            }

                            if (!hitInSt) break;

                            chainCount++;
                            const p = getDenchuPayout(spec);
                            myBalls += p;
                            chainPayout += p;
                            updateDisplay(rotations, myBalls, totalInvestment);
                            addLog(`  ${chainCount}連目: ST${stSpin}回転 +${p.toLocaleString()}発`, 'log-chain');
                            playEffect('chain', `${chainCount}連`, `+${p.toLocaleString()}発`, 800);
                            flashStat('ballsDisplay');
                            await sleep(baseDelay * 4);
                        }

                        addLog(`${rushName}終了 → ${chainCount}連チャン！ 計${chainPayout.toLocaleString()}発`, 'log-st');
                        maxSessionChain = Math.max(maxSessionChain, chainCount);
                        maxSessionPayout = Math.max(maxSessionPayout, chainPayout);
                    } else {
                        // 残保留チェック
                        if (spec.zanhoCount > 0) {
                            addLog(`時短終了... 残保留チェック（${spec.zanhoCount}個）`, 'log-jitan');
                            playEffect('chance', '残保留', `${spec.zanhoCount}個チェック`, 900);
                            await sleep(baseDelay * 2);

                            let zanhoHit = false;
                            for (let i = 0; i < spec.zanhoCount; i++) {
                                if (Math.random() < spec.hitProb) {
                                    zanhoHit = true;
                                    hitCount++;
                                    const payout = getDenchuPayout(spec);
                                    myBalls += payout;
                                    addLog(`✨ 残保留${i + 1}個目で当たり！ +${payout.toLocaleString()}発`, 'log-hit');
                                    playEffect('hit', '残保留当り', `+${payout.toLocaleString()}発`, 1200);
                                    updateDisplay(rotations, myBalls, totalInvestment);
                                    flashStat('ballsDisplay');

                                    // RUSH処理
                                    const rushName = getRushName(machineKey);
                                    addLog(`>>> ${rushName}突入！（${spec.stSpins}回転）`, 'log-st');
                                    setState(rushName, `${spec.stSpins}回転`);
                                    playEffect('rush', rushName, `${spec.stSpins}回転`, 1200);
                                    await sleep(baseDelay * 5);

                                    let chainCount = 1;
                                    let chainPayout = payout;

                                    while (!shouldStop) {
                                        let stSpin = 0;
                                        let hitInSt = false;

                                        for (stSpin = 1; stSpin <= spec.stSpins; stSpin++) {
                                            if (Math.random() < spec.stHitProb) {
                                                hitInSt = true;
                                                break;
                                            }
                                        }

                                        if (!hitInSt) break;

                                        chainCount++;
                                        const p = getDenchuPayout(spec);
                                        myBalls += p;
                                        chainPayout += p;
                                        updateDisplay(rotations, myBalls, totalInvestment);
                                        addLog(`  ${chainCount}連目: ST${stSpin}回転 +${p.toLocaleString()}発`, 'log-chain');
                                        playEffect('chain', `${chainCount}連`, `+${p.toLocaleString()}発`, 800);
                                        flashStat('ballsDisplay');
                                        await sleep(baseDelay * 4);
                                    }

                                    addLog(`${rushName}終了 → ${chainCount}連チャン！ 計${chainPayout.toLocaleString()}発`, 'log-st');
                                    maxSessionChain = Math.max(maxSessionChain, chainCount);
                                    maxSessionPayout = Math.max(maxSessionPayout, chainPayout);
                                    break;
                                }
                            }

                            if (!zanhoHit) {
                                addLog(`→ 通常状態へ`, 'log-jitan');
                            }
                        } else {
                            addLog(`時短終了 → 通常状態へ`, 'log-jitan');
                        }
                    }
                }

                await sleep(baseDelay * 2);
            }

            // 最終結果
            updateDisplay(rotations, myBalls, totalInvestment);
            const finalProfit = Math.floor(myBalls * 4) - totalInvestment;

            addLog('─'.repeat(30));
            addLog(`【最終結果】`);
            addLog(`総回転数: ${rotations.toLocaleString()}回転`);
            addLog(`初当り: ${hitCount}回`);
            addLog(`持ち玉: ${Math.floor(myBalls).toLocaleString()}発`);
            addLog(`収支: ${(finalProfit >= 0 ? '+' : '')}${finalProfit.toLocaleString()}円`);

            // 結果表示
            document.getElementById('finalSpins').textContent = rotations.toLocaleString();
            document.getElementById('finalHits').textContent = hitCount;
            document.getElementById('finalBalls').textContent = Math.floor(myBalls).toLocaleString();
            const finalProfitEl = document.getElementById('finalProfit');
            finalProfitEl.textContent = (finalProfit >= 0 ? '+' : '') + finalProfit.toLocaleString() + '円';
            finalProfitEl.className = 'final-stat-value ' + (finalProfit >= 0 ? 'profit-plus' : 'profit-minus');
            const finalResultPanel = document.getElementById('finalResult');
            finalResultPanel.className = `final-result ${finalProfit >= 0 ? 'result-win' : 'result-loss'}`;
            finalResultPanel.style.display = 'block';

            // 累計収支に追加
            addSessionResult(totalInvestment, Math.floor(myBalls));

            // ランキング更新
            updateRankingWithResult(finalProfit, maxSessionChain, maxSessionPayout);

            setState('終了');
            playEffect(
                finalProfit >= 0 ? 'final-plus' : 'final-minus',
                finalProfit >= 0 ? '勝利' : '終了',
                `${finalProfit >= 0 ? '+' : ''}${finalProfit.toLocaleString()}円`,
                0
            );
            btn.textContent = 'もう一度';
            btn.style.background = 'linear-gradient(135deg, #ff6b6b, #ee5a5a)';
            isRunning = false;
        }

        // 速度スライダー
        document.getElementById('speed').addEventListener('input', (e) => {
            document.getElementById('speedLabel').textContent = e.target.value;
        });

        document.getElementById('machine').addEventListener('change', (e) => {
            const machineKey = e.target.value;
            setMachineTheme(machineKey);
            setStageMode('idle', 'READY', SPECS[machineKey].name);
        });

        setMachineTheme(document.getElementById('machine').value);
        setStageMode('idle', 'READY', '待機中');
        updateReels(0);
    </script>
</body>
</html>
