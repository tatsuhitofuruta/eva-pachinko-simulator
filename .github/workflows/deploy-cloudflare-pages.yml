name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Build, validate, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python@v6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m compileall eva_simulator.py tests scripts
          python -m unittest discover -s tests -v
          python scripts/validate_static_site.py
          python scripts/build_pages.py
          cmp index.html dist/index.html
          node --check functions/api/leaderboard.js

      - name: Build Pages Functions
        run: npx --yes wrangler@4.115.0 pages functions build --outdir=.wrangler/functions-build

      - name: Deploy to Cloudflare Pages
        # cloudflare/wrangler-action@v3
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.115.0
          command: pages deploy dist --project-name=eva-pachinko-simulator --branch=main --commit-hash=${{ github.sha }}
