name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Build, validate, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        # actions/setup-python@v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m compileall eva_simulator.py tests scripts
          python -m unittest discover -s tests -v
          python scripts/validate_static_site.py
          python scripts/build_pages.py
          cmp index.html dist/index.html
          node --check functions/api/leaderboard.js

      - name: Build Pages Functions
        run: npx --yes wrangler@4.115.0 pages functions build --outdir=.wrangler/functions-build

      - name: Deploy to Cloudflare Pages
        # cloudflare/wrangler-action@v3
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.115.0
          command: pages deploy dist --project-name=eva-pachinko-simulator --branch=main --commit-hash=${{ github.sha }}
